# We need to configure the database connection properties
# so that the application can connect to the database.
# The properties include the database URL, username, and password.

spring.datasource.url=jdbc:mysql://localhost:3306/db_books
spring.datasource.username=root
spring.datasource.password=secret
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
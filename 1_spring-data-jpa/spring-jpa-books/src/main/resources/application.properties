# Thymeleaf cache (disable in dev)
spring.thymeleaf.cache=false

# Allows/prevents transaction from being tied to Hibernate during view rendering
# Ensures the transaction is **active during view rendering**, allowing proper access to lazy associations if needed.
# Controverso: use false, pois senão a transaction vai estar vinculada ao hibernate desde a view.
spring.jpa.open-in-view=false

# Docker container will not be closed when application shutdown
# spring.docker.compose.lifecycle-management=start_only

# Whether Docker Compose support is enabled
#spring.docker.compose.enabled=false

# Whether Flyway support is enabled
#spring.flyway.enabled=false

# Enable logging of SQL statements
# spring.jpa.show-sql=true
# Format the logged SQL statements to make them readable
# spring.jpa.properties.hibernate.format_sql=true
# Optional: Highlight the SQL syntax with color in the console log
# spring.jpa.properties.hibernate.highlight_sql=true
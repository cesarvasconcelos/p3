# https://hub.docker.com/_/mariadb
# https://github.com/docker/awesome-compose
services:
    mariadb:
        image: 'mariadb:lts'
        container_name: db
        volumes:
#            - ./init.sql:/docker-entrypoint-initdb.d/init.sql # leia more-about-db-initialization.txt
            - vol_bookstore:/var/lib/mysql
        environment:
            - 'MARIADB_DATABASE=${MARIADB_DATABASE}'
            - 'MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}'
            - 'MARIADB_USER=${MARIADB_USER}'
            - 'MARIADB_PASSWORD=${MARIADB_PASSWORD}'
        ports:
            - '3306:3306'
        # HEALTHCHECK: container iniciado != servico pronto.
        # Sem healthcheck, o Docker considera o container pronto assim que o processo inicia, e o
        # Spring Boot Docker Compose segue esse criterio: a aplicacao tenta conectar cedo demais.
        # Na 1a execucao (volume vazio) a imagem oficial (MariaDB ou MySQL) sobe um servidor
        # temporario so com socket Unix, sem TCP; ele cria o banco e os usuarios, desliga e so
        # entao sobe o servidor definitivo. Nesse intervalo a conexao TCP e fechada pelo servidor.
        # O healthcheck e como o Docker descobre quando o banco aceita conexoes; o Compose
        # (depends_on com condition: service_healthy) e o Spring esperam por ele. Essa e a forma
        # documentada e padrao de esperar um banco ficar pronto em qualquer compose.
        # --connect exige conexao TCP; --innodb_initialized espera o InnoDB ficar pronto.
        #
        # Equivalente para MySQL (o -h 127.0.0.1 forca TCP; sem ele o ping passa pelo socket e o
        # servidor temporario responde, reproduzindo o mesmo problema):
        #   test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-p$$MYSQL_ROOT_PASSWORD']
        healthcheck:
            test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
            interval: 2s       # de quanto em quanto tempo o Docker executa o teste
            timeout: 5s        # tempo maximo de uma execucao do teste; passou disso, conta como falha
            retries: 30        # falhas consecutivas toleradas antes de marcar como unhealthy (30 x 2s = ~60s)
            start_period: 5s   # carencia inicial: falhas nesse periodo nao contam para o retries
volumes:
    vol_bookstore:
        name: "vol_bookstore" # Set volume name